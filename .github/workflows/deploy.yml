name: CI/CD Multi-Branch Pipeline to Oracle VPS

on:
  push:
    branches:
      - develop  # Kích hoạt deploy Pre-production
      - main     # Kích hoạt deploy Production

jobs:
  # JOB 1: DEPLOY PRE-PRODUCTION (Nhánh develop -> Port 8081)
  deploy-preprod:
    name: Deploy to Pre-production (Port 8081)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Pre-prod via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/trasua-preprod
            
            # Cập nhật mã nguồn nhánh develop bằng giao thức SSH Deploy Key
            if [ ! -d ".git" ]; then
              git clone -b develop git@github.com:${{ github.repository }}.git .
            else
              git fetch origin develop
              git reset --hard origin/develop
            fi
            
            # Khởi động / Build lại app-preprod mà không làm gián đoạn MySQL
            docker compose build app-preprod
            docker compose up -d app-preprod mysql-preprod
            
            # Dọn dẹp cache docker cũ để giải phóng dung lượng VPS
            docker image prune -f

  # JOB 2: DEPLOY PRODUCTION (Nhánh main -> Port 80)
  deploy-prod:
    name: Deploy to Production (Port 80)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Prod via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/trasua-prod
            
            # Cập nhật mã nguồn nhánh main bằng giao thức SSH Deploy Key
            if [ ! -d ".git" ]; then
              git clone -b main git@github.com:${{ github.repository }}.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            
            # Khởi động / Build lại app-prod mà không làm gián đoạn MySQL
            docker compose build app-prod
            docker compose up -d app-prod mysql-prod
            
            # Dọn dẹp cache docker cũ để giải phóng dung lượng VPS
            docker image prune -f