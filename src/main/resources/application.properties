spring.application.name=trasua
server.port=${PORT:8080}
server.address=0.0.0.0

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
app.mail.from=${MAIL_FROM:thoain.n2006@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:UTETra Zen Gallery}


# Spring MVC JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MySql / TiDB Cloud
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HikariCP Pool Optimization cho Cloud Container
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Tomcat TLD Scanning Optimization (Bỏ qua JAR backend không chứa JSP taglib, giữ lại Spring MVC và JSTL)
server.tomcat.additional-tld-skip-patterns=hibernate-*.jar,mysql-*.jar,jackson-*.jar,lombok-*.jar,tomcat-embed-*.jar,micrometer-*.jar,byte-buddy-*.jar,angus-*.jar,jakarta.mail-*.jar,h2-*.jar,cloudinary-*.jar,httpclient-*.jar,httpcore-*.jar,jjwt-*.jar,slf4j-*.jar,logback-*.jar

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Hiển thị thông báo lỗi chi tiết khi gặp sự cố
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true