spring.application.name=trasua
server.port=${PORT:8080}
server.address=0.0.0.0

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:thoain.n2006@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:UTETra Zen Gallery}

# Spring MVC JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MySql / TiDB Cloud (Đảm bảo serverTimezone=Asia/Ho_Chi_Minh chống lệch múi giờ)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trasua?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}}
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# Timezone Configuration (GMT+7 - Asia/Ho_Chi_Minh) đồng bộ Cloud Container & Database
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HikariCP Pool Optimization cho Cloud Container
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Tomcat TLD Scanning Optimization (Bỏ qua JAR backend không chứa JSP taglib, giữ lại Spring MVC và JSTL)
server.tomcat.additional-tld-skip-patterns=hibernate-*.jar,mysql-*.jar,jackson-*.jar,lombok-*.jar,tomcat-embed-*.jar,micrometer-*.jar,byte-buddy-*.jar,angus-*.jar,jakarta.mail-*.jar,h2-*.jar,cloudinary-*.jar,httpclient-*.jar,httpcore-*.jar,jjwt-*.jar,slf4j-*.jar,logback-*.jar

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Hiển thị thông báo lỗi chi tiết khi gặp sự cố
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Cấu hình VietQR Quầy POS Bán Lẻ
app.vietqr.bank-bin=${VIETQR_BANK_BIN:970422}
app.vietqr.bank-name=${VIETQR_BANK_NAME:MBBank}
app.vietqr.account-no=${VIETQR_ACCOUNT_NO:0396202885}
app.vietqr.account-name=${VIETQR_ACCOUNT_NAME:UTETRA TEA GALLERY}

# Cloudinary Media Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Jackson Configuration
spring.jackson.deserialization.fail-on-null-for-primitives=false

# =================================================================
# PAYOS PAYMENT GATEWAY CONFIGURATION (UC06)
# Đọc biến môi trường từ file .env qua springboot4-dotenv
# =================================================================
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/checkout/payos/return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/checkout/payos/cancel}

